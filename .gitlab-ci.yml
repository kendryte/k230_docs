# How to do manually markdonw-lint or markdown-link?
# docker run --rm   -v "$(pwd)":/workspace   -w /workspace   ai.b-bug.org:5000/markdown:latest   /bin/sh -c "find . -name '*.md' -print0 | xargs -0 markdownlint-cli2"
# docker run -it --rm -v $(pwd):/workspace -w /workspace ai.b-bug.org:5000/huangziyi/lychee:latest --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" /workspace

variables:
  GITLAB_REPO: git@g.a-bug.org:maix_sw/k230_docs.git
  GITHUB_REPO: git@github.com:kendryte/k230_docs.git
  GITEE_REPO: git@gitee.com:kendryte/k230_docs.git

  # ============================================================
  # k230-docs 镜像仓库配置
  # ------------------------------------------------------------
  # 当前 registry 配置为免认证 push (不依赖 CI/CD Variables)
  # 如未来需鉴权，需重新启用 build_web_html.before_script 里的 docker login
  # 并在 CI/CD Variables 中提供 REGISTRY_USER / REGISTRY_PASSWORD
  #
  # 标签策略:
  #   main          -> ${IMAGE_REGISTRY}/${IMAGE_NAME}:latest-prod
  #   dev/*, feat/* -> ${IMAGE_REGISTRY}/${IMAGE_NAME}:latest-dev
  # ============================================================
  IMAGE_REGISTRY: ai.b-bug.org:5000
  IMAGE_NAME: k230-docs

  # Sphinx + docker CLI + pandoc 全预装在镜像里，避免在 CI 里再 pip install / apt install
  WEB_DOCS_BUILDER_IMAGE: ai.b-bug.org:5000/huangziyi/web-docs-builder:latest

default:
  interruptible: true
  image: ai.b-bug.org:5000/k230_sdk:latest

stages:
  - lint
  - translate
  - build
  - deploy
  - sync_mirrors

# ============================================
# Markdown 语法检查
# ============================================
markdown_lint:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push"

  stage: lint
  timeout: 30m
  retry: 2
  image: ai.b-bug.org:5000/markdown:latest
  tags:
    - markdown-lint

  script:
    - echo "===== Markdown Lint ====="
    - uname -a
    - whoami
    - id
    - pwd

    # ----------------------------------------
    # 1. Markdownlint 语法检查
    # ----------------------------------------
    - echo "Running markdownlint..."
    - find . -name "*.md" -print0 | xargs -0 markdownlint-cli2

    # ----------------------------------------
    # 2. 文件名 slug 检查, 只允许英文文件名， 否则自动翻译会翻译文件名后造成链接失败
    # ----------------------------------------
    - echo "Checking markdown filenames for English slugs..."
    - |
      FAILED_FILES=$(find . -name "*.md" -not -path "*/.*" -exec basename {} \; | grep -Ev "^[a-zA-Z0-9_.+-]+\.md$" || true)
      if [ -n "$FAILED_FILES" ]; then
        echo "❌ 错误：发现不符合 slug 规范的 Markdown 文件名"
        echo ""
        echo "规范：仅允许 a-z A-Z 0-9 _ - . +"
        echo ""
        echo "$FAILED_FILES"
        exit 1
      else
        echo "✅ 文件名检查通过"
      fi

    # ----------------------------------------
    # 3. 中文 anchor 检查, 只允许英文anchor, 否则自动翻译标题后造成 anchor 失败
    # ----------------------------------------
    - echo "Checking Chinese anchors..."
    - |
      BAD_ANCHORS=$(find . -name "*.md" -not -path "*/.*" -print0 | xargs -0 grep -E '\]\([^)]*#[^)]*[^ -~]' || true)
      if [ -n "$BAD_ANCHORS" ]; then
        echo "❌ 错误：检测到中文 Anchor"
        echo ""
        echo "$BAD_ANCHORS"
        echo ""
        echo "规范：Markdown 链接中的 anchor 必须为英文，例如："
        echo "  ❌ guide.md#1-概述"
        echo "  ✅ guide.md#overview"
        exit 1
      else
        echo "✅ Anchor 检查通过"
      fi

    - echo "===== Markdown Lint Passed ====="

# ============================================
# Link 检查 (使用 lychee, 原来用的markdown-link检查有缺陷)
# ============================================
lychee_link_check:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push"
  stage: lint
  timeout: 10m
  tags:
    - markdown-link-check
  image:
    name: ai.b-bug.org:5000/huangziyi/lychee:latest
    entrypoint: [""]
  script:
    - uname -a
    - whoami
    - pwd
    - lychee --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" .
    

# ============================================
# 自动翻译任务
# ============================================
auto_translate:
  stage: translate
  image: ai.b-bug.org:5000/canmv/gitdoctranslator:latest
  tags:
    - docker-runner-192.168.1.104
  resource_group: auto-translate-$CI_COMMIT_BRANCH
  variables:
    GIT_STRATEGY: clone
    GIT_SUBMODULE_STRATEGY: recursive
    GITLAB_REPO: $CI_PROJECT_URL
    DOCS_DIR: $CI_PROJECT_DIR
  rules:
    - when: never
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_MESSAGE !~ /\[skip ci\]/
  before_script:
    # --- 打印关键调试 ---
    - echo $SHELL
    - whoami
    - id
    - set
    - pwd
    - ls -alht
    - uname -a
    - ls -alht $CI_PROJECT_DIR
    - echo $CI_PROJECT_DIR
    - echo $CI_PROJECT_NAME
    - echo $CI_PIPELINE_SOURCE
    - echo $DOCS_DIR
    - echo $LLM_PROVIDER
    - echo $LLM_MODEL
    - echo $LLM_MAX_TOKENS
    - echo $LLM_SECTION_MAX_TOKENS
    - echo $LLM_API_KEY
    - echo $LLM_TEMPERATURE
    
    # 初始化 SSH 环境 (用于 Deploy Key)
    - echo "Setting up SSH for Deploy Key..."
    - "which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )"
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | ssh-add - > /dev/null
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n    StrictHostKeyChecking no\n" > ~/.ssh/config'
    
    # --- 2. 配置 Git 身份与环境 ---
    - git config --global user.email "auto@canaan-creative.com"
    - git config --global user.name "GitDocTranslator Bot"
    - git config --global --add safe.directory $CI_PROJECT_DIR

    # --- 3. 切换远程仓库地址为 SSH (使用刚刚添加的私钥进行鉴权) ---
    - git remote set-url origin git@${CI_SERVER_HOST}:${CI_PROJECT_PATH}.git

    # --- 4. 对齐分支 (解决 Detached HEAD 问题) ---
    - git fetch --tags
    - git checkout -B $CI_COMMIT_REF_NAME origin/$CI_COMMIT_REF_NAME

  script:
    - |
      gitdoctranslator sync \
        --lang en \
        --ci-mode \
        --log-level DEBUG
  after_script:
    - echo "Translation completed"

# ============================================
# 构建生产环境文档
# ============================================
build_web_html:
  stage: build
  rules:
    # main / dev/* / feat/* 均触发，构建产物镜像化为 k230-docs:latest-{prod|dev}
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^(main|dev\/|feat\/)/ && $CI_COMMIT_MESSAGE !~ /\[skip ci\]/
  image: $WEB_DOCS_BUILDER_IMAGE
  tags:
    - docker-runner-10.10.1.94

  variables:
    DOCKER_BUILDKIT: "0"  # 当前镜像里的 docker CLI 没装 buildx，回到 legacy builder（会有一条 DEPRECATED 警告，可忽略）

  # docker CLI 已随镜像预装，假定 runner 已挂载 /var/run/docker.sock
  before_script:
    - 'docker info >/dev/null 2>&1 || { echo "ERROR: docker daemon unreachable，请检查 gitlab-runner 是否挂载 /var/run/docker.sock"; exit 1; }'
  script:
    - git config --global user.email "auto@canaan-creative.com"
    - git config --global user.name "GitLab CI"
    - git config --global --add safe.directory "*"
    
    # 直接删除所有本地遗留分支，然后重新检出目标分支至本地，保证本地只有一个目标分支作为初始工作环境
    - rm -rf .git/refs/heads/*
    - rm -f .git/packed-refs
    - git fetch origin --prune --tags --force
    - git checkout -B "$CI_COMMIT_REF_NAME" "origin/$CI_COMMIT_REF_NAME"
    
    # 收集所有需要构建的 ref（分支 + 符合版本条件的 tags）
    # ==========================================================================
    # 核心逻辑：平行时空预处理 (Worktree Isolation Preprocessing)
    # --------------------------------------------------------------------------
    # 1. 原因：Git 远程分支和 Tag 是只读的（Detached HEAD），无法直接原地修改并 Commit。
    # 2. 方案：利用 git worktree 为每个需要构建的 ref 创建一个独立的临时目录。
    # 3. 转化：
    #    - 分支：将 origin/main 检出为本地真实的 main 分支。
    #    - 标签：将 v1.6 标签“升格”检出为本地同名的 v1.6 分支。
    # 4. 手术：在各临时目录中运行 python 脚本修改 Markdown（去封面、修链接等）。
    # 5. 固化：在临时目录执行 git commit，将修改永远留在 CI 容器的本地 Git 引用中。
    # 6. 结果：Sphinx 构建时，会直接读取这些本地已 commit 的分支，从而达成让指定分支或版本获得预处理后的文档。
    # ==========================================================================
    - |
      echo "Collecting refs for preprocessing..."

      WORKTREE_BASE=$(mktemp -d)
      echo "WORKTREE_BASE=$WORKTREE_BASE"

      # BRANCHES 决定 worktree 额外预处理哪些分支（当前分支由后续 python3 md_bat_mod_tool.py . 处理）
      # main pipeline：当前目录已是 main，不需要额外 worktree；dev pipeline：需要 worktree 预处理 main
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        BRANCHES=
      else
        BRANCHES=$(git branch -r --format="%(refname:short)" | grep -E '^origin/(main|dev/|feat/).*' | grep -v "^origin/$CI_COMMIT_REF_NAME$" || true)
      fi
      TAGS=$(git tag -l 'v*' || true)

      echo "Preprocessing branches: $BRANCHES"
      echo "Preprocessing tags: $TAGS"

      preprocess_branch() {
        local ref=$1
        local wt_dir=$WORKTREE_BASE/$(echo "$ref" | tr '/' '_')
        local branch_name="${ref#origin/}"
        echo "=== Preprocessing: $ref -> $branch_name ==="
        git worktree add -B "$branch_name" "$wt_dir" "$ref"
        python3 md_bat_mod_tool.py heading "$wt_dir" || true
        python3 md_bat_mod_tool.py fixlink "$wt_dir" || true
        python3 md_bat_mod_tool.py domain  "$wt_dir" || true
        python3 md_bat_mod_tool.py cover   "$wt_dir" || true
        cd "$wt_dir"
        git add -A "*.md"
        if git diff --cached --quiet; then
          echo "  No changes"
        else
          git commit -m "preprocess: strip numbers and fix anchors"
        fi
        cd - > /dev/null
        git worktree remove "$wt_dir"
        echo "=== Done: $branch_name ==="
      }

      preprocess_tag() {
        local tag=$1
        local wt_dir=$WORKTREE_BASE/tag-$(basename "$tag")
        local branch_name="$(basename "$tag")"
        echo "=== Preprocessing: $tag -> $branch_name ==="
        git worktree add -B "$branch_name" "$wt_dir" "$tag"
        python3 md_bat_mod_tool.py heading "$wt_dir" || true
        python3 md_bat_mod_tool.py fixlink "$wt_dir" || true
        python3 md_bat_mod_tool.py domain  "$wt_dir" || true
        python3 md_bat_mod_tool.py cover   "$wt_dir" || true
        cd "$wt_dir"
        git add -A "*.md"
        if git diff --cached --quiet; then
          echo "  No changes"
        else
          git commit -m "preprocess: strip numbers and fix anchors"
        fi
        cd - > /dev/null
        git worktree remove "$wt_dir"
        echo "=== Done: $branch_name ==="
      }

      export -f preprocess_branch preprocess_tag

      echo "$BRANCHES" | xargs -P4 -I{} bash -c 'preprocess_branch "{}"'
      echo "$TAGS"    | xargs -P4 -I{} bash -c 'preprocess_tag "{}"'

      python3 md_bat_mod_tool.py heading . || true
      python3 md_bat_mod_tool.py fixlink . || true
      python3 md_bat_mod_tool.py domain  . || true
      python3 md_bat_mod_tool.py cover   . || true
      git add -A "*.md"
      if ! git diff --cached --quiet; then
        git commit -m "preprocess: strip numbers and fix anchors"
      fi
      echo "Current branch '$CI_COMMIT_REF_NAME' preprocessed."

      rm -rf "$WORKTREE_BASE"
      echo "All refs preprocessed."

      # --- 清理远程分支引用 ---
      # 强制删除本地存储的远程分支指针，让本地环境变成一个“纯本地”库
      # 这样 Sphinx 的正则就只能匹配到你刚刚本地 commit 过的分支
      git branch -r -D $(git branch -r) || true

    # 检查当前的 commit 是否精确对应某一个 Git Tag
    # 如果是tag, 则返回 tag 号，否则返回 branch 名
    - |
      if git describe --tags --exact-match 2>/dev/null; then
        VERSION=$(git describe --tags --exact-match)
      else
        VERSION=$CI_COMMIT_REF_NAME
      fi
      echo "Building version: $VERSION"

      # 显式清理并构建，加入 -v 查看详细静态文件处理逻辑
      make clean-templates
      make clean
      make mhtml SPHINXOPTS="-v"
      
    - echo "VERSION=$VERSION" > version.env

    # _build/ 体积超出 artifacts 上限，改用 docker 镜像作传输载体
    - mkdir -p docs/en docs/zh
    - cp -r _build/en/. docs/en/
    - cp -r _build/zh/. docs/zh/

    - |
      case "$CI_COMMIT_BRANCH" in
        main)
          IMAGE_TAG="latest-prod"
          ;;
        dev/*|feat/*)
          IMAGE_TAG="latest-dev"
          ;;
        *)
          IMAGE_TAG="latest-dev"
          ;;
      esac
      echo ">>> IMAGE_TAG=$IMAGE_TAG (branch=$CI_COMMIT_REF_NAME)"

    - docker build -t "${IMAGE_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}" .
    - docker push "${IMAGE_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

  artifacts:
    paths:
      - version.env

# ============================================
# 部署到生产环境 (kendryte.com)
# ============================================
# 直接以 build_web_html 生成的镜像作为 runner 镜像：
# 镜像里 /app/docs 就是构建产物，runner 把 /data 挂到宿主机部署目录即可。
deploy_production_kendryte_com:
  stage: deploy
  image:
    name: ${IMAGE_REGISTRY}/${IMAGE_NAME}:latest-prod
    pull_policy: always  # 对带 tag 的镜像默认是 if-not-present；always 保证用上 build_web_html 刚 push 的版本
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
  tags:
    - docker-runner-kendryte.com
  retry: 2
  script:
    # 假定 gitlab-runner 已挂载 /data → 宿主机部署目录
    - rm -rf /data/docker-projects/kendryte.com/bbs-website/website_data/docs/k230_docs/en /data/docker-projects/kendryte.com/bbs-website/website_data/docs/k230_docs/zh && cp -r /app/docs/. /data/docker-projects/kendryte.com/bbs-website/website_data/docs/k230_docs/ && echo '==> Deployed to kendryte.com'

# ============================================
# 部署到测试环境 (北京94服务器)
# ============================================
deploy_beijing_94:
  stage: deploy
  image:
    name: ${IMAGE_REGISTRY}/${IMAGE_NAME}:latest-dev
    pull_policy: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^(dev\/|feat\/)/ && $CI_COMMIT_MESSAGE !~ /\[skip ci\]/
  tags:
    - docker-runner-10.10.1.94
  retry: 2
  script:
    # 假定 gitlab-runner 已挂载 /data1 → 宿主机部署目录
    - rm -rf /data/docker-projects/kendryte.com/bbs-website/website_data/docs/k230_docs/en /data/docker-projects/kendryte.com/bbs-website/website_data/docs/k230_docs/zh && cp -r /app/docs/. /data/docker-projects/kendryte.com/bbs-website/website_data/docs/k230_docs/ && echo '==> Deployed to Beijing 94'
