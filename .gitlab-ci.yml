# ============================================
# 部署到深圳104服务器
# ============================================
deploy_shenzhen_104:
  stage: deploy
  image: ai.b-bug.org:5000/huangziyi/deploy:v1
  dependencies:
    - build_web_html
  rules:
    - when: never
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"
  tags:
    - docker-runner-192.168.1.104
  retry: 2
  before_script:
    - echo $SHELL
    - whoami
    - id
    - set
    - pwd
    - ls -alht
    - uname -a
    - ls -alht $CI_PROJECT_DIR
    - echo $CI_PROJECT_DIR
    - echo $CI_PROJECT_NAME
    - echo $CI_PIPELINE_SOURCE
    - ls /
  script:
    - |
      if [ -f version.env ]; then source version.env; fi
      echo "Deploying version: ${VERSION:-unknown}"
      mkdir -p /data/docker-projects/kendryte.com/bbs-website/website_data/docs/k230_docs/en/ /data/docker-projects/kendryte.com/bbs-website/website_data/docs/k230_docs/zh/
      if [ -z "$VERSION" ]; then echo "VERSION is empty, aborting"; exit 1; fi
      rm -rf /data/docker-projects/kendryte.com/bbs-website/website_data/docs/k230_docs/en/
      rm -rf /data/docker-projects/kendryte.com/bbs-website/website_data/docs/k230_docs/zh/
      mkdir -p /data/docker-projects/kendryte.com/bbs-website/website_data/docs/k230_docs/en/ /data/docker-projects/kendryte.com/bbs-website/website_data/docs/k230_docs/zh/
      cp -r _build/en/. /data/docker-projects/kendryte.com/bbs-website/website_data/docs/k230_docs/en/
      cp -r _build/zh/. /data/docker-projects/kendryte.com/bbs-website/website_data/docs/k230_docs/zh/




