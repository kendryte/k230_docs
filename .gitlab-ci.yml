# How to do manually markdonw-lint or markdown-link?
# docker run --rm   -v "$(pwd)":/workspace   -w /workspace   ai.b-bug.org:5000/markdown:latest   /bin/sh -c "find . -name '*.md' -print0 | xargs -0 markdownlint-cli2"
# docker run -it --rm -v $(pwd):/workspace -w /workspace ai.b-bug.org:5000/huangziyi/lychee:latest --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" /workspace

variables:
  GITLAB_REPO: git@g.a-bug.org:maix_sw/k230_docs.git
  GITHUB_REPO: git@github.com:kendryte/k230_docs.git
  GITEE_REPO: git@gitee.com:kendryte/k230_docs.git

default:
  interruptible: true
  image: ai.b-bug.org:5000/k230_sdk:latest

stages:
  - lint
  - translate
  - build
  - deploy
  - sync_mirrors

# ============================================
# Markdown 语法检查
# ============================================
markdown_lint:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push"

  stage: lint
  timeout: 30m
  retry: 2
  image: ai.b-bug.org:5000/markdown:latest
  tags:
    - markdown-lint

  script:
    - echo "===== Markdown Lint ====="
    - uname -a
    - whoami
    - id
    - pwd

    # ----------------------------------------
    # 1. Markdownlint 语法检查
    # ----------------------------------------
    - echo "Running markdownlint..."
    - find . -name "*.md" -print0 | xargs -0 markdownlint-cli2

    # ----------------------------------------
    # 2. 文件名 slug 检查, 只允许英文文件名， 否则自动翻译会翻译文件名后造成链接失败
    # ----------------------------------------
    - echo "Checking markdown filenames for English slugs..."
    - |
      FAILED_FILES=$(find . -name "*.md" -not -path "*/.*" -exec basename {} \; | grep -Pv "^[a-z0-9_\-\.]+\.md$" || true)
      if [ -n "$FAILED_FILES" ]; then
        echo "❌ 错误：发现不符合 slug 规范的 Markdown 文件名"
        echo ""
        echo "规范：仅允许 a-z 0-9 _ - ."
        echo ""
        echo "$FAILED_FILES"
        exit 1
      else
        echo "✅ 文件名检查通过"
      fi

    # ----------------------------------------
    # 3. 中文 anchor 检查, 只允许英文anchor, 否则自动翻译标题后造成 anchor 失败
    # ----------------------------------------
    - echo "Checking Chinese anchors..."
    - |
      BAD_ANCHORS=$(grep -rP "\]\([^)]*#[^)]*[\x{4e00}-\x{9fa5}]" --include="*.md" . || true)
      if [ -n "$BAD_ANCHORS" ]; then
        echo "❌ 错误：检测到中文 Anchor"
        echo ""
        echo "$BAD_ANCHORS"
        echo ""
        echo "规范：Markdown 链接中的 anchor 必须为英文，例如："
        echo "  ❌ guide.md#1-概述"
        echo "  ✅ guide.md#overview"
        exit 1
      else
        echo "✅ Anchor 检查通过"
      fi

    - echo "===== Markdown Lint Passed ====="

# ============================================
# Link 检查 (使用 lychee, 原来用的markdown-link检查有缺陷)
# ============================================
lychee_link_check:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push"
  stage: lint
  timeout: 10m
  tags:
    - markdown-link-check
  image:
    name: ai.b-bug.org:5000/huangziyi/lychee:latest
    entrypoint: [""]
  script:
    - uname -a
    - whoami
    - pwd
    - lychee --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" .
    

# ============================================
# 自动翻译任务
# ============================================
auto_translate:
  stage: translate
  image: ai.b-bug.org:5000/canmv/gitdoctranslator:latest
  tags:
    - docker-runner-192.168.1.104
  variables:
    # 强制 Runner 每次都执行 git clone 而不是 git fetch
    GIT_STRATEGY: clone
    # 可选：确保子模块（如果有）也重新初始化
    GIT_SUBMODULE_STRATEGY: recursive
    # GitLab CI 会自动注入这些变量
    GITLAB_REPO: $CI_PROJECT_URL
    DOCS_DIR: $CI_PROJECT_DIR
  rules:
    # 仅在 push 到 dev 分支时触发，如果包括[skip ci]则不启动此任务
    - when: never
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev" && $CI_COMMIT_MESSAGE !~ /\[skip ci\]/
  before_script:
    # --- 打印关键调试 ---
    - echo $SHELL
    - whoami
    - id
    - set
    - pwd
    - ls -alht
    - uname -a
    - ls -alht $CI_PROJECT_DIR
    - echo $CI_PROJECT_DIR
    - echo $CI_PROJECT_NAME
    - echo $CI_PIPELINE_SOURCE
    - echo $DOCS_DIR
    - echo $LLM_PROVIDER
    - echo $LLM_MODEL
    - echo $LLM_MAX_TOKENS
    - echo $LLM_SECTION_MAX_TOKENS
    - echo $LLM_API_KEY
    - echo $LLM_TEMPERATURE
    
    # 初始化 SSH 环境 (用于 Deploy Key)
    - echo "Setting up SSH for Deploy Key..."
    - "which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )"
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | ssh-add - > /dev/null
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n    StrictHostKeyChecking no\n" > ~/.ssh/config'
    
    # --- 2. 配置 Git 身份与环境 ---
    - git config --global user.email "auto@canaan-creative.com"
    - git config --global user.name "GitDocTranslator Bot"
    - git config --global --add safe.directory $CI_PROJECT_DIR

    # --- 3. 切换远程仓库地址为 SSH (使用刚刚添加的私钥进行鉴权) ---
    - git remote set-url origin git@${CI_SERVER_HOST}:${CI_PROJECT_PATH}.git

    # --- 4. 对齐分支 (解决 Detached HEAD 问题) ---
    - git fetch --tags
    - git checkout -B $CI_COMMIT_REF_NAME origin/$CI_COMMIT_REF_NAME

  script:
    - |
      gitdoctranslator sync \
        --lang en \
        --ci-mode \
        --log-level DEBUG
  after_script:
    - echo "Translation completed"

# ============================================
# 构建测试环境文档
# ============================================
build_web_html:
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(main|dev)$/
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^(main|dev)$/
  image: ai.b-bug.org:5000/huangziyi/web-docs-builder:3d9c3f0b2be1fe67b3b2f4e5d47504f6c2662b76
  tags:
    - docker-runner-10.10.1.94
  script:
    - git fetch --tags --force
    - git checkout -B $CI_COMMIT_REF_NAME origin/$CI_COMMIT_REF_NAME
    - git config --global user.email "auto@canaan-creative.com"
    - git config --global user.name "GitLab CI"
    - git config --global --add safe.directory "*"

    # 收集所有需要构建的 ref（分支 + 符合版本条件的 tags）
    # ==========================================================================
    # 核心逻辑：平行时空预处理 (Worktree Isolation Preprocessing)
    # --------------------------------------------------------------------------
    # 1. 原因：Git 远程分支和 Tag 是只读的（Detached HEAD），无法直接原地修改并 Commit。
    # 2. 方案：利用 git worktree 为每个需要构建的 ref 创建一个独立的临时目录。
    # 3. 转化：
    #    - 分支：将 origin/main 检出为本地真实的 main 分支。
    #    - 标签：将 v1.6 标签“升格”检出为本地同名的 v1.6 分支。
    # 4. 手术：在各临时目录中运行 python 脚本修改 Markdown（去封面、修链接等）。
    # 5. 固化：在临时目录执行 git commit，将修改永远留在 CI 容器的本地 Git 引用中。
    # 6. 结果：Sphinx 构建时，会直接读取这些本地已 commit 的分支，从而达成让指定分支或版本获得预处理后的文档。
    # ==========================================================================
    - |
      echo "Collecting refs for preprocessing..."

      WORKTREE_BASE=$(mktemp -d)
      echo "WORKTREE_BASE=$WORKTREE_BASE"

      BRANCHES=$(git branch -r --format="%(refname:short)" | grep -E '^origin/(main|dev)$' | grep -v "origin/$CI_COMMIT_REF_NAME$" || true)
      TAGS=$(git tag -l 'v*' || true)

      echo "Preprocessing branches: $BRANCHES"
      echo "Preprocessing tags: $TAGS"

      # 清理上次 CI 遗留的同名本地分支（上次 worktree 删除了，但分支还在）
      for ref in $BRANCHES; do
        local_branch="$(basename "$ref")"
        git branch -D "$local_branch" 2>/dev/null && echo "Cleaned stale branch: $local_branch" || true
      done
      for tag in $TAGS; do
        git branch -D "$tag" 2>/dev/null && echo "Cleaned stale branch: $tag" || true
      done

      preprocess_branch() {
        local ref=$1
        local wt_dir=$WORKTREE_BASE/${ref//\//_}
        local branch_name="$(basename "$ref")"
        echo "=== Preprocessing: $ref -> $branch_name ==="
        git worktree add -b "$branch_name" "$wt_dir" "$ref"
        python3 md_bat_mod_tool.py heading "$wt_dir" || true
        python3 md_bat_mod_tool.py fixlink "$wt_dir" || true
        python3 md_bat_mod_tool.py domain  "$wt_dir" || true
        python3 md_bat_mod_tool.py cover   "$wt_dir" || true
        cd "$wt_dir"
        git add -A "*.md"
        if git diff --cached --quiet; then
          echo "  No changes"
        else
          git commit -m "preprocess: strip numbers and fix anchors"
        fi
        cd - > /dev/null
        git worktree remove "$wt_dir"
        echo "=== Done: $branch_name ==="
      }

      preprocess_tag() {
        local tag=$1
        local wt_dir=$WORKTREE_BASE/tag-$(basename "$tag")
        local branch_name="$(basename "$tag")"
        echo "=== Preprocessing: $tag -> $branch_name ==="
        git worktree add -b "$branch_name" "$wt_dir" "$tag"
        python3 md_bat_mod_tool.py heading "$wt_dir" || true
        python3 md_bat_mod_tool.py fixlink "$wt_dir" || true
        python3 md_bat_mod_tool.py domain  "$wt_dir" || true
        python3 md_bat_mod_tool.py cover   "$wt_dir" || true
        cd "$wt_dir"
        git add -A "*.md"
        if git diff --cached --quiet; then
          echo "  No changes"
        else
          git commit -m "preprocess: strip numbers and fix anchors"
        fi
        cd - > /dev/null
        git worktree remove "$wt_dir"
        echo "=== Done: $branch_name ==="
      }

      export -f preprocess_branch preprocess_tag

      echo "$BRANCHES" | xargs -P4 -I{} bash -c 'preprocess_branch "{}"'
      echo "$TAGS"    | xargs -P4 -I{} bash -c 'preprocess_tag "{}"'

      python3 md_bat_mod_tool.py heading . || true
      python3 md_bat_mod_tool.py fixlink . || true
      python3 md_bat_mod_tool.py domain  . || true
      python3 md_bat_mod_tool.py cover   . || true
      git add -A "*.md"
      if ! git diff --cached --quiet; then
        git commit -m "preprocess: strip numbers and fix anchors"
      fi
      echo "Current branch '$CI_COMMIT_REF_NAME' preprocessed."

      rm -rf "$WORKTREE_BASE"
      echo "All refs preprocessed."

      # --- 清理远程分支引用 ---
      # 强制删除本地存储的远程分支指针，让本地环境变成一个“纯本地”库
      # 这样 Sphinx 的正则就只能匹配到你刚刚本地 commit 过的分支
      git branch -r -D $(git branch -r) || true

    # 核心修复：安装兼容的“黄金版本”组合
    # 放弃强制 7.3.7，使用 Sphinx 6.x 以兼容 myst-parser 和 docutils < 0.19
    - pip install -i https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple \
        "sphinx>=6.2.1,<7.0.0" \
        "docutils<0.19" \
        "myst-parser>=1.0.0" \
        "sphinx-book-theme" \
        "sphinx-multiversion" \
        "sphinx-copybutton" \
        "sphinxcontrib-mermaid"
    
    # 检查当前的 commit 是否精确对应某一个 Git Tag
    # 如果是tag, 则返回 tag 号，否则返回 branch 名
    - |
      if git describe --tags --exact-match 2>/dev/null; then
        VERSION=$(git describe --tags --exact-match)
      else
        VERSION=$CI_COMMIT_REF_NAME
      fi
      echo "Building version: $VERSION"

      # 显式清理并构建，加入 -v 查看详细静态文件处理逻辑
      make clean-templates
      make clean
      make mhtml SPHINXOPTS="-v"
      
    - echo "VERSION=$VERSION" > version.env

    # 因为 k230_docs这个库产生的文件大小过大，已超过 artifacts的存储限制
    # 所以，暂时采用workaround, 直接在本地服务器中转进行文件复制和部署,
    - rm -rf /data1/k230/docs/*
    - cp -r _build/* /data1/k230/docs/

  # artifacts:
  #   paths:
  #     - _build
  #     - version.env


# ============================================
# 部署到生产环境 (kendryte.com)
# ============================================
deploy_production_kendryte_com:
  stage: deploy
  image: ai.b-bug.org:5000/huangziyi/deploy:v1
  dependencies:
    - build_web_html
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
  tags:
    - docker-runner-10.10.1.94
  retry: 2
  script:
    - |
      # 1. 远程清理并重新创建您提到的 k230_docs 目录 
      ssh -p $AWS_PORT $AWS "rm -rf /data/docker-projects/kendryte.com/bbs-website/website_data/docs/k230_docs/en/ /data/docker-projects/kendryte.com/bbs-website/website_data/docs/k230_docs/zh/"
      ssh -p $AWS_PORT $AWS "mkdir -p /data/docker-projects/kendryte.com/bbs-website/website_data/docs/k230_docs/en/ /data/docker-projects/kendryte.com/bbs-website/website_data/docs/k230_docs/zh/"

      # 2. 使用 scp 将本地文件复制到远程 (注意目标路径前的冒号 :)
      scp -P $AWS_PORT -C -r /data1/k230/docs/en/* $AWS:/data/docker-projects/kendryte.com/bbs-website/website_data/docs/k230_docs/en/
      scp -P $AWS_PORT -C -r /data1/k230/docs/zh/* $AWS:/data/docker-projects/kendryte.com/bbs-website/website_data/docs/k230_docs/zh/

